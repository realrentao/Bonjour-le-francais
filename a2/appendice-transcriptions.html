<span style="margin-left:auto;color:var(--muted);font-size:13px">点击 🔊 听发音</span></div></div>
<div class="lesson-head"><div class="wrap"><h1>Transcriptions</h1>
<div class="sub">听力原文</div></div></div>
<div class="wrap">
<div class="section"><p style="color:var(--muted)">各课对话的法语原文汇总，便于跟读与听写训练。（对话文本见各课「对话」板块，此处提供速查索引。）</p></div>
<div class="section"><p>每一课的 Dialogue 板块即对应听力原文，点击 🔊 可逐句跟读。建议先盲听再对照文本。</p></div>
<div class="wrap" style="display:flex;gap:12px;margin:18px 0"><a class="btn" href="index.html">← 返回目录</a></div>
</div>
<footer><div class="wrap"><span class="brand"><img src="../assets/logo-piano.jpg" alt="涛子办事处" class="footer-logo">涛子办事处</span></div></footer>
<script>let SLOW = false;
function audioUrl(key){ return '../audio/'+key+(SLOW?'.slow':'')+'.mp3'; }
function playKey(key){ if(!key) return; new Audio(audioUrl(key)).play(); }
function playFr(btn){ const k=btn.getAttribute('data-k'); if(k) playKey(k); }
function setSlow(on){ SLOW=on; document.querySelectorAll('.switch').forEach(s=>s.classList.toggle('on',on)); const l=document.getElementById('slowLabel'); if(l) l.textContent='慢速朗读：'+(on?'开':'关'); }
document.querySelectorAll('.switch').forEach(s=>s.addEventListener('click',()=>setSlow(!SLOW)));
 document.addEventListener('DOMContentLoaded',()=>{
  try{ const p=JSON.parse(localStorage.getItem('fr_progress')||'{}'); applyProgress(p);}catch(e){}
  const lid=document.body.getAttribute('data-lesson'); if(lid){ markVisited(lid); }
});
function markVisited(lid){ let p=readP(); p[lid]=Object.assign(p[lid]||{},{visited:true}); writeP(p); }
function readP(){ try{return JSON.parse(localStorage.getItem('fr_progress')||'{}');}catch(e){return {};} }
function writeP(p){ localStorage.setItem('fr_progress',JSON.stringify(p)); }
function applyProgress(p){
  document.querySelectorAll('.lrow').forEach(r=>{
    const id=r.getAttribute('data-lesson'); if(!id) return;
    const st=p[id]; if(st&&st.visited){ const b=r.querySelector('.prog'); if(b) b.textContent='已学 ✓'; }
  });
  document.querySelectorAll('.pbar > i').forEach(bar=>{
    const book=bar.getAttribute('data-book'); if(!book) return;
    const keys=JSON.parse(bar.getAttribute('data-keys')||'[]');
    const done=keys.filter(k=>p[k]&&p[k].visited).length;
    bar.style.width=(keys.length?Math.round(done/keys.length*100):0)+'%';
  });
}
function checkChoice(btn,idx,correct,ex){
  const opts=ex.querySelectorAll('.opt');
  opts.forEach((o,i)=>{ o.style.pointerEvents='none';
    if(i===correct) o.classList.add('correct'); if(i===idx&&i!==correct) o.classList.add('wrong'); });
  const fb=ex.querySelector('.fb');
  if(idx===correct){ fb.textContent='✓ 正确！'; fb.className='fb ok'; }
  else { fb.textContent='✗ 正确答案：'+ex.querySelectorAll('.opt')[correct].textContent.trim(); fb.className='fb bad'; }
}
function checkFill(btn,ans,ex){
  const inp=ex.querySelector('.fill'); const fb=ex.querySelector('.fb');
  const ok=inp.value.trim().toLowerCase()===ans.toLowerCase();
  if(ok){ fb.textContent='✓ 正确！'; fb.className='fb ok'; inp.classList.add('correct'); }
  else { fb.textContent='✗ 正确答案：'+ans; fb.className='fb bad'; }
}
</script>
</body></html>
